name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build & Push Docker Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

env:
  NAMESPACE: iom-preprod
  BACKEND_IMAGE: ghcr.io/maersk-global/iom/tfr-backend
  FRONTEND_IMAGE: ghcr.io/maersk-global/iom/tfr-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Install kubelogin
        run: |
          curl -sLO https://github.com/Azure/kubelogin/releases/latest/download/kubelogin-linux-amd64.zip
          unzip -q kubelogin-linux-amd64.zip
          sudo mv bin/linux_amd64/kubelogin /usr/local/bin/kubelogin
          kubelogin --version

      - name: Convert kubeconfig to use service principal
        run: |
          kubelogin convert-kubeconfig -l spn \
            --client-id "${{ secrets.ARM_CLIENT_ID }}" \
            --client-secret "${{ secrets.ARM_CLIENT_SECRET }}" \
            --tenant-id "${{ secrets.ARM_TENANT_ID }}"

      - name: Verify cluster connection
        run: kubectl get pods -n ${{ env.NAMESPACE }} --request-timeout=10s || true

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Deploy backend
        run: |
          TAG=${{ github.event.inputs.image_tag || 'latest' }}
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          fi
          sed "s|:latest|:${TAG}|g" k8s/backend.yaml | kubectl apply -f -

      - name: Deploy frontend
        run: |
          TAG=${{ github.event.inputs.image_tag || 'latest' }}
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          fi
          sed "s|:latest|:${TAG}|g" k8s/frontend.yaml | kubectl apply -f -

      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/tfr-backend \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/tfr-frontend \
            -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Summary
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 App: https://telikos-first-responder.sit.maersk-digital.net"
          kubectl get pods -n ${{ env.NAMESPACE }} -l 'app in (tfr-backend,tfr-frontend)'
