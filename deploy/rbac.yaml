# Read-only, namespace-scoped ServiceAccount for the Issue Assistant.
# Lets the app read pod logs and events WITHOUT cluster-admin.
# Apply with:  kubectl apply -f deploy/rbac.yaml
#
# To generate a kubeconfig for LOCAL development from this SA, see README.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issue-assistant
  namespace: telikos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-assistant-readonly
  namespace: telikos
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-assistant-readonly
  namespace: telikos
subjects:
  - kind: ServiceAccount
    name: issue-assistant
    namespace: telikos
roleRef:
  kind: Role
  name: issue-assistant-readonly
  apiGroup: rbac.authorization.k8s.io
