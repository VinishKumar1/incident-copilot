# =============================================================
# Telikos First Responder — Kubernetes Secret (template)
# Create this manually in the cluster — do NOT commit actual values.
#
#   kubectl create secret generic tfr-secrets \
#     --from-literal=GRAFANA_TOKEN=<token> \
#     --from-literal=OPENAI_API_KEY=<key> \
#     --from-literal=DATABASE_URL=postgresql://... \
#     --from-literal=ARM_CLIENT_ID=<id> \
#     --from-literal=ARM_CLIENT_SECRET=<secret> \
#     --from-literal=ARM_TENENT_ID=<tenant> \
#     -n iom-preprod
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: tfr-secrets
  namespace: iom-preprod
type: Opaque
stringData:
  GRAFANA_TOKEN: "<REPLACE>"
  OPENAI_API_KEY: "<REPLACE>"
  DATABASE_URL: "<REPLACE>"
  ARM_CLIENT_ID: "<REPLACE>"
  ARM_CLIENT_SECRET: "<REPLACE>"
  ARM_TENENT_ID: "<REPLACE>"
