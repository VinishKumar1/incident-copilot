# =============================================================
# Telikos First Responder — Azure Key Vault CSI SecretProviderClass
# Namespace: iom-preprod
#
# Prerequisites (already configured for iom-preprod):
#   - AKS addon: azure-keyvault-secrets-provider enabled
#   - ServiceAccount ohpiom-np-sa has workload identity bound to a
#     managed identity with "Key Vault Secrets User" role on ohpiom-nonprod-kv
#
# How to use:
#   1. Update the secret names below (objectName) to match your vault.
#      You can find them in: https://portal.azure.com → ohpiom-nonprod-kv → Secrets
#   2. Apply: kubectl apply -f k8s/secret-provider.yaml
#
# The SecretProviderClass creates a K8s Secret "tfr-secrets" that the
# backend Deployment consumes via envFrom (see backend.yaml).
# =============================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tfr-secret-provider
  namespace: iom-preprod
spec:
  provider: azure
  secretObjects:
    # This block creates a K8s Secret named "tfr-secrets" from the vault values.
    # The backend pod picks these up automatically via envFrom.
    - secretName: tfr-secrets
      type: Opaque
      data:
        - objectName: tfr-grafana-token       # ← update to your vault secret name
          key: GRAFANA_TOKEN
        - objectName: tfr-openai-api-key      # ← update to your vault secret name
          key: OPENAI_API_KEY
        - objectName: tfr-database-url        # ← update to your vault secret name
          key: DATABASE_URL
        - objectName: tfr-arm-client-id       # ← update to your vault secret name
          key: ARM_CLIENT_ID
        - objectName: tfr-arm-client-secret   # ← update to your vault secret name
          key: ARM_CLIENT_SECRET
        - objectName: tfr-arm-tenant-id       # ← update to your vault secret name
          key: ARM_TENENT_ID
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: ""                              # leave blank — workload identity via SA annotation
    keyvaultName: "ohpiom-nonprod-kv"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: tfr-grafana-token       # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
        - |
          objectName: tfr-openai-api-key      # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
        - |
          objectName: tfr-database-url        # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
        - |
          objectName: tfr-arm-client-id       # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
        - |
          objectName: tfr-arm-client-secret   # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
        - |
          objectName: tfr-arm-tenant-id       # ← update to your vault secret name
          objectType: secret
          objectVersion: ""
    tenantId: "05d75c05-fa1a-42e7-9cf1-eb416c396f2d"
