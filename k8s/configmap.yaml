# =============================================================
# Telikos First Responder — Kubernetes ConfigMap
# Non-secret config only. Secrets go in a K8s Secret (see deploy.yaml).
# Namespace: iom-preprod
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tfr-config
  namespace: iom-preprod
data:
  USE_MOCK: "false"
  LOG_SOURCE: "grafana"
  K8S_NAMESPACE: "iom-preprod"
  K8S_CLUSTERS: "ohp-np-west-1,ohp-prod-west-1"
  GRAFANA_URL: "https://grafana.maersk.io"
  GRAFANA_DATASOURCE_UID: "loki"
  LOOKBACK_SECONDS: "300"
  POLL_INTERVAL_SECONDS: "15"
  MAX_LINES_PER_POLL: "1000"
  LOKI_TIMEOUT_SECONDS: "60"
  LLM_PROVIDER: "openai"
  CORS_ORIGINS: "https://telikos-first-responder.sit.maersk-digital.net"
  SSO_ENABLED: "true"
  AZURE_AD_TENANT_ID: "05d75c05-fa1a-42e7-9cf1-eb416c396f2d"
  AZURE_AD_CLIENT_ID: "fdb5c5f4-d589-495b-8b84-c0f3abad2eb0"
