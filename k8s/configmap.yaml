# =============================================================
# Telikos First Responder — Kubernetes ConfigMap
# Namespace: iom-preprod
#
# Non-secret values are set here directly.
# Secret values (marked REPLACE_WITH_KV_PATH) will be injected
# automatically by the cluster's Key Vault integration from ohpiom-nonprod-kv.
# Update the paths to match your vault secret names before deploying.
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tfr-config
  namespace: iom-preprod
data:
  # ── Application config ──────────────────────────────────────
  USE_MOCK: "false"
  LOG_SOURCE: "grafana"
  K8S_NAMESPACE: "iom-preprod"
  K8S_CLUSTERS: "ohp-np-west-1,ohp-prod-west-1"
  GRAFANA_URL: "https://grafana.maersk.io"
  GRAFANA_DATASOURCE_UID: "loki"
  LOOKBACK_SECONDS: "300"
  POLL_INTERVAL_SECONDS: "15"
  MAX_LINES_PER_POLL: "1000"
  LOKI_TIMEOUT_SECONDS: "60"
  LLM_PROVIDER: "openai"
  CORS_ORIGINS: "https://telikos-first-responder.sit.maersk-digital.net"
  SSO_ENABLED: "true"
  AZURE_AD_TENANT_ID: "05d75c05-fa1a-42e7-9cf1-eb416c396f2d"
  AZURE_AD_CLIENT_ID: "fdb5c5f4-d589-495b-8b84-c0f3abad2eb0"
  # ── Secrets (injected from ohpiom-nonprod-kv by cluster KV integration) ──
  GRAFANA_TOKEN: "REPLACE_WITH_KV_PATH"
  OPENAI_API_KEY: "REPLACE_WITH_KV_PATH"
  DATABASE_URL: "REPLACE_WITH_KV_PATH"
  ARM_CLIENT_ID: "REPLACE_WITH_KV_PATH"
  ARM_CLIENT_SECRET: "REPLACE_WITH_KV_PATH"
  ARM_TENENT_ID: "REPLACE_WITH_KV_PATH"
