# =============================================================
# Telikos First Responder — Frontend Deployment + Service
# Namespace: iom-preprod
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfr-frontend
  namespace: iom-preprod
  labels:
    app: tfr-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tfr-frontend
  template:
    metadata:
      labels:
        app: tfr-frontend
    spec:
      serviceAccountName: ohpiom-np-sa
      imagePullSecrets:
        - name: image-pull-secret
        - name: harbor-read-only
      containers:
        - name: frontend
          image: ghcr.io/maersk-global/iom/tfr-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: tfr-frontend
  namespace: iom-preprod
spec:
  selector:
    app: tfr-frontend
  ports:
    - port: 80
      targetPort: 80
